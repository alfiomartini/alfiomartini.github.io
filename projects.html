<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Projects</title>
    <meta
      name="description"
      content="Web projects by Alfio Martini written in JavaScript, Python, React and Node.js, with demo videos and source code."
    />
    <meta name="theme-color" content="#12232e" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Projects" />
    <meta
      property="og:description"
      content="Web projects by Alfio Martini written in JavaScript, Python, React and Node.js, with demo videos and source code."
    />
    <meta
      property="og:url"
      content="https://alfiomartini.github.io/projects.html"
    />
    <meta
      property="og:image"
      content="https://alfiomartini.github.io/assets/img/profile_picture_10_11_2020-min.jpg"
    />
    <link rel="canonical" href="https://alfiomartini.github.io/projects.html" />
    <link href="./assets/img/favicon.ico" rel="icon" />
    <link rel="stylesheet" href="css/styles.css" />
    <link rel="stylesheet" href="css/projects.css" />
  </head>
  <body>
    <div class="main">
      <header class="header"></header>
      <section class="checkboxes">
        <div class="form-check form-check-inline">
          <input
            type="checkbox"
            class="form-check-input"
            id="language-javascript"
            data-language="javascript"
            value=""
          />
          <label class="form-check-label" for="language-javascript">JavaScript</label>
        </div>
        <div class="form-check form-check-inline">
          <input
            type="checkbox"
            class="form-check-input"
            id="language-python"
            data-language="python"
            value=""
          />
          <label class="form-check-label" for="language-python">Python</label>
        </div>
        <div class="form-check form-check-inline">
          <input
            type="checkbox"
            class="form-check-input"
            id="language-react"
            data-language="react"
            value=""
          />
          <label class="form-check-label" for="language-react">React</label>
        </div>
        <div class="form-check form-check-inline">
          <input
            type="checkbox"
            class="form-check-input"
            id="language-node"
            data-language="node"
            value=""
          />
          <label class="form-check-label" for="language-node">Node</label>
        </div>
        <button type="button" class="btn btn-primary btn-sm" id="btn-counter">
          projects <span class="badge text-bg-light counter">0</span>
        </button>
      </section>
      <section class="projects mt-4"></section>
    </div>
    <!-- end main -->
    <script type="module" src="./js/main.js"></script>
    <script type="module" src="./js/projects.js"></script>
  </body>
</html>
